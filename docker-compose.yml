services:
  backend:
    build: ./backend
    container_name: django_backend
    env_file:
      - ./backend/.env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: postgres_db
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume: