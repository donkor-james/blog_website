server {
    listen 80;
    server_name writespace.duckdns.org;
    return 301 https://$host$request_uri;  # redirect HTTP to HTTPS
}

server {
    listen 443 ssl;
    server_name writespace.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/writespace.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writespace.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /django-static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}